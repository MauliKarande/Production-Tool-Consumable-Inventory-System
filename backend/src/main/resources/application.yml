server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: ameya-inventory

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/ameya_inventory?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:CHANGE_ME_local_dev_only_secret_key_min_32_bytes_long!!}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:480}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  alerts:
    recompute-interval-ms: ${ALERTS_RECOMPUTE_INTERVAL_MS:900000}
    pending-return-days: ${ALERTS_PENDING_RETURN_DAYS:30}
    high-consumption-factor: ${ALERTS_HIGH_CONSUMPTION_FACTOR:2.0}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.ameya.inventory: INFO
